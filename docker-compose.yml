version: "3.9"

services:
  db:
    image: postgres:15
    container_name: finance_db
    environment:
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: company_finance
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: